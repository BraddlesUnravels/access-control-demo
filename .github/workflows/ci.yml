name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_SUPABASE_PUBLISHABLE_KEY: local-build-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  database:
    name: Database security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_CLI_VERSION: '2.114.0'
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} start -x vector

      - name: Run RLS and access-gate tests
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} stop --no-backup
