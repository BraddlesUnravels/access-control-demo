name: Production Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production
      url: ${{ steps.deploy.outputs.application_url }}

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      AZURE_CORE_ONLY_SHOW_ERRORS: '0'

      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_CUSTOM_DOMAIN: ${{ vars.AZURE_CUSTOM_DOMAIN }}
      AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID: ${{ vars.AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID }}
      AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
      AZURE_SECRET_READER_IDENTITY: ${{ vars.AZURE_SECRET_READER_IDENTITY }}

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail

          required_values=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            AZURE_LOCATION
            AZURE_CONTAINER_ENVIRONMENT
            AZURE_CONTAINER_APP
            AZURE_CUSTOM_DOMAIN
            AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID
            AZURE_KEY_VAULT
            AZURE_SECRET_READER_IDENTITY
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          )

          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name:-}" ]]; then
              echo "Missing production environment value: ${value_name}" >&2
              exit 1
            fi
          done

      - name: Resolve image names
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY,,}"

          echo "sha=ghcr.io/${repository}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "latest=ghcr.io/${repository}:latest" >> "${GITHUB_OUTPUT}"

      - name: Sign in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --file docker/Dockerfile \
            --progress plain \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --build-arg "SOURCE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${{ steps.image.outputs.sha }}" \
            --tag "${{ steps.image.outputs.latest }}" \
            .

      - name: Verify production image excludes development packages
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --entrypoint /usr/bin/node \
            "${{ steps.image.outputs.sha }}" \
            -e '
              const unexpectedPackages = [
                "@eslint/eslintrc",
                "@vitejs/plugin-react",
                "eslint",
                "next-themes",
                "pino-pretty",
                "prettier",
                "typescript",
                "vitest",
                "vitest-browser-react",
              ];

              let unexpectedPackageFound = false;

              for (const packageName of unexpectedPackages) {
                try {
                  require.resolve(packageName);
                  console.error(`Unexpected package in runtime image: ${packageName}`);
                  unexpectedPackageFound = true;
                } catch (error) {
                  if (error?.code !== "MODULE_NOT_FOUND") {
                    throw error;
                  }
                }
              }

              if (unexpectedPackageFound) {
                process.exit(1);
              }
            '

      - name: Test production image
        shell: bash
        run: |
          set -euo pipefail

          container_name="access-control-demo-production-test"

          test_access_gate_code_secret="$(openssl rand -hex 32)"
          test_access_gate_cookie_secret="$(openssl rand -hex 32)"

          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }

          show_logs() {
            docker logs "${container_name}" 2>/dev/null || true
          }

          assert_status() {
            local expected_status="$1"
            local url="$2"
            shift 2
            local actual_status

            actual_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$@" \
                "${url}"
            )"

            if [[ "${actual_status}" != "${expected_status}" ]]; then
              show_logs
              echo \
                "Expected ${url} to return ${expected_status}; received ${actual_status}." \
                >&2
              exit 1
            fi
          }

          trap cleanup EXIT
          cleanup

          docker run \
            --detach \
            --name "${container_name}" \
            --publish 3200:3000 \
            --env "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --env "ACCESS_GATE_DISABLED=false" \
            --env "ACCESS_GATE_CODE_SECRET=${test_access_gate_code_secret}" \
            --env "ACCESS_GATE_COOKIE_SECRET=${test_access_gate_cookie_secret}" \
            "${{ steps.image.outputs.sha }}"

          healthy=false

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3200/api/health \
              >/dev/null; then
              healthy=true
              break
            fi

            sleep 2
          done

          if [[ "${healthy}" != 'true' ]]; then
            show_logs
            echo "Production container did not become healthy." >&2
            exit 1
          fi

          assert_status 200 "http://127.0.0.1:3200/"
          assert_status 307 "http://127.0.0.1:3200/auth/login"
          assert_status 401 "http://127.0.0.1:3200/api/consultations"

          assert_status \
            401 \
            "http://127.0.0.1:3200/api/access/unlock" \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"code":"ACD-PRODUCTION-SMOKE"}'

      - name: Push production image
        shell: bash
        run: |
          set -euo pipefail

          docker push "${{ steps.image.outputs.sha }}"
          docker push "${{ steps.image.outputs.latest }}"

      - name: Verify public image access
        shell: bash
        run: |
          set -euo pipefail

          docker logout ghcr.io

          docker image rm \
            "${{ steps.image.outputs.sha }}" \
            "${{ steps.image.outputs.latest }}" \
            >/dev/null 2>&1 || true

          if ! docker pull "${{ steps.image.outputs.sha }}"; then
            echo "Azure cannot pull the GHCR image anonymously." >&2
            echo "Change the GHCR package visibility to Public and rerun this job." >&2
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify production bootstrap resources
        shell: bash
        run: |
          set -euo pipefail

          key_vault_id="$(
            az keyvault show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_KEY_VAULT}" \
              --query id \
              --output tsv
          )"

          secret_reader_principal_id="$(
            az identity show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_SECRET_READER_IDENTITY}" \
              --query principalId \
              --output tsv
          )"

          if [[ -z "${key_vault_id}" ]]; then
            echo "Production Key Vault was not found. Run deploy/azure/bootstrap-oidc.sh first." >&2
            exit 1
          fi

          if [[ -z "${secret_reader_principal_id}" ]]; then
            echo "Production secret-reader identity was not found. Run deploy/azure/bootstrap-oidc.sh first." >&2
            exit 1
          fi

          role_assignments="$(
            az role assignment list \
              --scope "${key_vault_id}" \
              --all \
              --output json
          )"

          echo "${role_assignments}" |
            jq --exit-status \
              --arg principal_id "${secret_reader_principal_id}" \
              --arg role_id '4633458b-17de-408a-b874-0445c86b69e6' \
              '
                any(
                  .[];
                  (.principalId | ascii_downcase) == ($principal_id | ascii_downcase) and
                  (.roleDefinitionId | ascii_downcase | endswith("/" + ($role_id | ascii_downcase)))
                )
              ' \
              >/dev/null || {
                echo "Secret-reader identity is missing the Key Vault Secrets User role." >&2
                echo "Run deploy/azure/bootstrap-oidc.sh from the trusted operator workstation." >&2
                exit 1
              }

      - name: Deploy Azure Container App
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          deployment_name="access-control-demo-${GITHUB_RUN_ID}"

          az deployment group create \
            --name "${deployment_name}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file deploy/azure/main.bicep \
            --parameters \
              location="${AZURE_LOCATION}" \
              environmentName="${AZURE_CONTAINER_ENVIRONMENT}" \
              containerAppName="${AZURE_CONTAINER_APP}" \
              keyVaultName="${AZURE_KEY_VAULT}" \
              secretReaderIdentityName="${AZURE_SECRET_READER_IDENTITY}" \
              image="${{ steps.image.outputs.sha }}" \
              supabaseUrl="${NEXT_PUBLIC_SUPABASE_URL}" \
              supabasePublishableKey="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
              customDomainName="${AZURE_CUSTOM_DOMAIN}" \
              customDomainCertificateId="${AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID}" \
            --output none

          application_url="$(
            az deployment group show \
              --name "${deployment_name}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.outputs.applicationUrl.value \
              --output tsv
          )"

          log_analytics_workspace="$(
            az deployment group show \
              --name "${deployment_name}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.outputs.observabilityWorkspaceName.value \
              --output tsv
          )"

          diagnostic_setting_name="$(
            az deployment group show \
              --name "${deployment_name}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.outputs.diagnosticSettingName.value \
              --output tsv
          )"

          if [[ -z "${application_url}" ]]; then
            echo "Azure deployment did not return an application URL." >&2
            exit 1
          fi

          if [[ -z "${log_analytics_workspace}" ]]; then
            echo "Azure deployment did not return a Log Analytics workspace name." >&2
            exit 1
          fi

          if [[ -z "${diagnostic_setting_name}" ]]; then
            echo "Azure deployment did not return a diagnostic setting name." >&2
            exit 1
          fi

          {
            echo "application_url=${application_url}"
            echo "log_analytics_workspace=${log_analytics_workspace}"
            echo "diagnostic_setting_name=${diagnostic_setting_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify Azure configuration
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ steps.image.outputs.sha }}
          EXPECTED_CUSTOM_DOMAIN: ${{ env.AZURE_CUSTOM_DOMAIN }}
          EXPECTED_CUSTOM_DOMAIN_CERTIFICATE_ID: ${{ env.AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID }}
          LOG_ANALYTICS_WORKSPACE: ${{ steps.deploy.outputs.log_analytics_workspace }}
          DIAGNOSTIC_SETTING_NAME: ${{ steps.deploy.outputs.diagnostic_setting_name }}
        run: |
          set -euo pipefail

          deployment_state="$(
            az containerapp show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_CONTAINER_APP}" \
              --query "{
                minReplicas: properties.template.scale.minReplicas,
                maxReplicas: properties.template.scale.maxReplicas,
                image: properties.template.containers[0].image,
                env: properties.template.containers[0].env,
                secretNames: properties.configuration.secrets[].name,
                customDomains: properties.configuration.ingress.customDomains
              }" \
              --output json
          )"

          echo "${deployment_state}" |
            jq --exit-status \
              --arg expected_image "${EXPECTED_IMAGE}" \
              --arg expected_custom_domain "${EXPECTED_CUSTOM_DOMAIN}" \
              --arg expected_certificate_id "${EXPECTED_CUSTOM_DOMAIN_CERTIFICATE_ID}" \
              '
                .minReplicas == 1 and
                .maxReplicas == 1 and
                .image == $expected_image and
                (.env | any(.name == "ACCESS_GATE_DISABLED" and .value == "false")) and
                (.env | any(.name == "ACCESS_GATE_CODE_SECRET" and .secretRef == "access-gate-code-secret")) and
                (.env | any(.name == "ACCESS_GATE_COOKIE_SECRET" and .secretRef == "access-gate-cookie-secret")) and
                (.secretNames | index("access-gate-code-secret") != null) and
                (.secretNames | index("access-gate-cookie-secret") != null) and
                (
                  .customDomains |
                  any(
                    .name == $expected_custom_domain and
                    .bindingType == "SniEnabled" and
                    (
                      (.certificateId | ascii_downcase) ==
                      ($expected_certificate_id | ascii_downcase)
                    )
                  )
                )
              ' \
              >/dev/null

          key_vault_uri="$(
            az keyvault show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_KEY_VAULT}" \
              --query properties.vaultUri \
              --output tsv
          )"

          secret_reader_identity_id="$(
            az identity show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_SECRET_READER_IDENTITY}" \
              --query id \
              --output tsv
          )"

          code_secret_reference="$(
            az containerapp show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_CONTAINER_APP}" \
              --query "properties.configuration.secrets[?name=='access-gate-code-secret'] | [0].{keyVaultUrl:keyVaultUrl,identity:identity}" \
              --output json
          )"

          cookie_secret_reference="$(
            az containerapp show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_CONTAINER_APP}" \
              --query "properties.configuration.secrets[?name=='access-gate-cookie-secret'] | [0].{keyVaultUrl:keyVaultUrl,identity:identity}" \
              --output json
          )"

          echo "${code_secret_reference}" |
            jq --exit-status \
              --arg expected_url "${key_vault_uri}secrets/access-gate-code-secret" \
              --arg expected_identity "${secret_reader_identity_id}" \
              '
                .keyVaultUrl == $expected_url and
                (.identity | ascii_downcase) == ($expected_identity | ascii_downcase)
              ' \
              >/dev/null

          echo "${cookie_secret_reference}" |
            jq --exit-status \
              --arg expected_url "${key_vault_uri}secrets/access-gate-cookie-secret" \
              --arg expected_identity "${secret_reader_identity_id}" \
              '
                .keyVaultUrl == $expected_url and
                (.identity | ascii_downcase) == ($expected_identity | ascii_downcase)
              ' \
              >/dev/null

          environment_id="$(
            az containerapp env show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_CONTAINER_ENVIRONMENT}" \
              --query id \
              --output tsv
          )"

          logging_destination="$(
            az containerapp env show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_CONTAINER_ENVIRONMENT}" \
              --query properties.appLogsConfiguration.destination \
              --output tsv
          )"

          if [[ "${logging_destination}" != 'azure-monitor' ]]; then
            echo \
              "Container Apps logging destination is ${logging_destination}; expected azure-monitor." \
              >&2
            exit 1
          fi

          workspace_id="$(
            az monitor log-analytics workspace show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --workspace-name "${LOG_ANALYTICS_WORKSPACE}" \
              --query id \
              --output tsv
          )"

          diagnostic_state="$(
            az monitor diagnostic-settings show \
              --name "${DIAGNOSTIC_SETTING_NAME}" \
              --resource "${environment_id}" \
              --output json
          )"

          echo "${diagnostic_state}" |
            jq --exit-status \
              --arg expected_workspace_id "${workspace_id}" \
              '
                (.workspaceId | ascii_downcase) == ($expected_workspace_id | ascii_downcase) and
                .logAnalyticsDestinationType == "Dedicated" and
                (.logs | any(.category == "ContainerAppConsoleLogs" and .enabled == true)) and
                (.logs | any(.category == "ContainerAppSystemLogs" and .enabled == true))
              ' \
              >/dev/null

      - name: Test deployed application
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.deploy.outputs.application_url }}
        run: |
          set -euo pipefail

          assert_status() {
            local expected_status="$1"
            local url="$2"
            shift 2
            local actual_status

            actual_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$@" \
                "${url}"
            )"

            if [[ "${actual_status}" != "${expected_status}" ]]; then
              echo \
                "Expected ${url} to return ${expected_status}; received ${actual_status}." \
                >&2
              exit 1
            fi
          }

          healthy=false

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "${APPLICATION_URL}/api/health" \
              >/dev/null; then
              healthy=true
              break
            fi

            sleep 5
          done

          if [[ "${healthy}" != 'true' ]]; then
            echo "Deployed application did not become healthy." >&2
            exit 1
          fi

          assert_status 200 "${APPLICATION_URL}/"
          assert_status 307 "${APPLICATION_URL}/auth/login"
          assert_status 401 "${APPLICATION_URL}/api/consultations"

          assert_status \
            401 \
            "${APPLICATION_URL}/api/access/unlock" \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"code":"ACD-PRODUCTION-SMOKE"}'

      - name: Publish deployment summary
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.deploy.outputs.application_url }}
          IMAGE: ${{ steps.image.outputs.sha }}
          LOG_ANALYTICS_WORKSPACE: ${{ steps.deploy.outputs.log_analytics_workspace }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Application: ${APPLICATION_URL}"
            echo "- Image: \`${IMAGE}\`"
            echo "- Container App: \`${AZURE_CONTAINER_APP}\`"
            echo "- Custom domain: \`${AZURE_CUSTOM_DOMAIN}\`"
            echo "- Key Vault: \`${AZURE_KEY_VAULT}\`"
            echo "- Secret reader identity: \`${AZURE_SECRET_READER_IDENTITY}\`"
            echo "- Log Analytics workspace: \`${LOG_ANALYTICS_WORKSPACE}\`"
            echo "- Logging destination: \`azure-monitor\`"
            echo "- Minimum replicas: \`1\`"
            echo "- Maximum replicas: \`1\`"
          } >> "${GITHUB_STEP_SUMMARY}"
