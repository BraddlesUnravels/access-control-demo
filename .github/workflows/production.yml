name: Production Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production
      url: ${{ steps.deploy.outputs.application_url }}

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      AZURE_CORE_ONLY_SHOW_ERRORS: '0'

      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_CUSTOM_DOMAIN: ${{ vars.AZURE_CUSTOM_DOMAIN }}
      AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID: ${{ vars.AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID }}

      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      ACCESS_GATE_CODE_SECRET: ${{ secrets.ACCESS_GATE_CODE_SECRET }}
      ACCESS_GATE_COOKIE_SECRET: ${{ secrets.ACCESS_GATE_COOKIE_SECRET }}

      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail

          required_values=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            AZURE_LOCATION
            AZURE_CONTAINER_ENVIRONMENT
            AZURE_CONTAINER_APP
            AZURE_CUSTOM_DOMAIN
            AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            ACCESS_GATE_CODE_SECRET
            ACCESS_GATE_COOKIE_SECRET
            EMAIL_PASSWORD
          )

          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name:-}" ]]; then
              echo "Missing production environment value: ${value_name}" >&2
              exit 1
            fi
          done

          if (( ${#ACCESS_GATE_CODE_SECRET} < 32 )); then
            echo "ACCESS_GATE_CODE_SECRET must be at least 32 characters." >&2
            exit 1
          fi

          if (( ${#ACCESS_GATE_COOKIE_SECRET} < 32 )); then
            echo "ACCESS_GATE_COOKIE_SECRET must be at least 32 characters." >&2
            exit 1
          fi

          if [[ "${ACCESS_GATE_CODE_SECRET}" == "${ACCESS_GATE_COOKIE_SECRET}" ]]; then
            echo "ACCESS_GATE_CODE_SECRET and ACCESS_GATE_COOKIE_SECRET must be different values." >&2
            exit 1
          fi

      - name: Resolve image names
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY,,}"

          echo "sha=ghcr.io/${repository}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "latest=ghcr.io/${repository}:latest" >> "${GITHUB_OUTPUT}"

      - name: Sign in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --file docker/Dockerfile \
            --progress plain \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --build-arg "SOURCE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${{ steps.image.outputs.sha }}" \
            --tag "${{ steps.image.outputs.latest }}" \
            .

      - name: Test production image
        shell: bash
        run: |
          set -euo pipefail

          container_name="access-control-demo-production-test"

          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }

          show_logs() {
            docker logs "${container_name}" 2>/dev/null || true
          }

          assert_status() {
            local expected_status="$1"
            local url="$2"
            shift 2
            local actual_status

            actual_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$@" \
                "${url}"
            )"

            if [[ "${actual_status}" != "${expected_status}" ]]; then
              show_logs
              echo \
                "Expected ${url} to return ${expected_status}; received ${actual_status}." \
                >&2
              exit 1
            fi
          }

          trap cleanup EXIT
          cleanup

          docker run \
            --detach \
            --name "${container_name}" \
            --publish 3200:3000 \
            --env "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --env "ACCESS_GATE_DISABLED=false" \
            --env "ACCESS_GATE_CODE_SECRET=${ACCESS_GATE_CODE_SECRET}" \
            --env "ACCESS_GATE_COOKIE_SECRET=${ACCESS_GATE_COOKIE_SECRET}" \
            "${{ steps.image.outputs.sha }}"

          healthy=false

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3200/api/health \
              >/dev/null; then
              healthy=true
              break
            fi

            sleep 2
          done

          if [[ "${healthy}" != 'true' ]]; then
            show_logs
            echo "Production container did not become healthy." >&2
            exit 1
          fi

          assert_status 200 "http://127.0.0.1:3200/"
          assert_status 307 "http://127.0.0.1:3200/auth/login"
          assert_status 401 "http://127.0.0.1:3200/api/consultations"

          assert_status \
            401 \
            "http://127.0.0.1:3200/api/access/unlock" \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"code":"ACD-PRODUCTION-SMOKE"}'

      - name: Push production image
        shell: bash
        run: |
          set -euo pipefail

          docker push "${{ steps.image.outputs.sha }}"
          docker push "${{ steps.image.outputs.latest }}"

      - name: Verify public image access
        shell: bash
        run: |
          set -euo pipefail

          docker logout ghcr.io

          docker image rm \
            "${{ steps.image.outputs.sha }}" \
            "${{ steps.image.outputs.latest }}" \
            >/dev/null 2>&1 || true

          if ! docker pull "${{ steps.image.outputs.sha }}"; then
            echo "Azure cannot pull the GHCR image anonymously." >&2
            echo "Change the GHCR package visibility to Public and rerun this job." >&2
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Container App
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          application_url="$(
            az deployment group create \
              --name "access-control-demo-${GITHUB_RUN_ID}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --template-file deploy/azure/main.bicep \
              --parameters \
                location="${AZURE_LOCATION}" \
                environmentName="${AZURE_CONTAINER_ENVIRONMENT}" \
                containerAppName="${AZURE_CONTAINER_APP}" \
                image="${{ steps.image.outputs.sha }}" \
                supabaseUrl="${NEXT_PUBLIC_SUPABASE_URL}" \
                supabasePublishableKey="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
                accessGateCodeSecret="${ACCESS_GATE_CODE_SECRET}" \
                accessGateCookieSecret="${ACCESS_GATE_COOKIE_SECRET}" \
                customDomainName="${AZURE_CUSTOM_DOMAIN}" \
                customDomainCertificateId="${AZURE_CUSTOM_DOMAIN_CERTIFICATE_ID}" \
              --query properties.outputs.applicationUrl.value \
              --output tsv
          )"

          if [[ -z "${application_url}" ]]; then
            echo "Azure deployment did not return an application URL." >&2
            exit 1
          fi

          echo "application_url=${application_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify Azure configuration
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail

          deployment_state="$(
            az resource show \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --resource-type "Microsoft.App/containerApps" \
              --name "${AZURE_CONTAINER_APP}" \
              --api-version "2026-01-01" \
              --query "{
                minReplicas: properties.template.scale.minReplicas,
                maxReplicas: properties.template.scale.maxReplicas,
                image: properties.template.containers[0].image,
                env: properties.template.containers[0].env,
                secretNames: properties.configuration.secrets[].name
                customDomains: properties.configuration.ingress.customDomains
              }" \
              --output json
          )"

          echo "${deployment_state}" |
            jq --exit-status \
              --arg expected_image "${EXPECTED_IMAGE}" \
              '
                .minReplicas == 1 and
                .maxReplicas == 1 and
                .image == $expected_image and
                (.env | any(.name == "ACCESS_GATE_DISABLED" and .value == "false")) and
                (.env | any(.name == "ACCESS_GATE_CODE_SECRET" and .secretRef == "access-gate-code-secret")) and
                (.env | any(.name == "ACCESS_GATE_COOKIE_SECRET" and .secretRef == "access-gate-cookie-secret")) and
                (.secretNames | index("access-gate-code-secret") != null) and
                (.secretNames | index("access-gate-cookie-secret") != null)
                (
                  .customDomains |
                  any(
                    .name == $expected_custom_domain and
                    .bindingType == "SniEnabled" and
                    (
                      (.certificateId | ascii_downcase) ==
                      ($expected_certificate_id | ascii_downcase)
                    )
                  )
                )
              ' \
              >/dev/null

      - name: Test deployed application
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.deploy.outputs.application_url }}
        run: |
          set -euo pipefail

          assert_status() {
            local expected_status="$1"
            local url="$2"
            shift 2
            local actual_status

            actual_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$@" \
                "${url}"
            )"

            if [[ "${actual_status}" != "${expected_status}" ]]; then
              echo \
                "Expected ${url} to return ${expected_status}; received ${actual_status}." \
                >&2
              exit 1
            fi
          }

          healthy=false

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "${APPLICATION_URL}/api/health" \
              >/dev/null; then
              healthy=true
              break
            fi

            sleep 5
          done

          if [[ "${healthy}" != 'true' ]]; then
            echo "Deployed application did not become healthy." >&2
            exit 1
          fi

          assert_status 200 "${APPLICATION_URL}/"
          assert_status 307 "${APPLICATION_URL}/auth/login"
          assert_status 401 "${APPLICATION_URL}/api/consultations"

          assert_status \
            401 \
            "${APPLICATION_URL}/api/access/unlock" \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"code":"ACD-PRODUCTION-SMOKE"}'

      - name: Publish deployment summary
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.deploy.outputs.application_url }}
          IMAGE: ${{ steps.image.outputs.sha }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Application: ${APPLICATION_URL}"
            echo "- Image: \`${IMAGE}\`"
            echo "- Container App: \`${AZURE_CONTAINER_APP}\`"
            echo "- Custom domain: \`${AZURE_CUSTOM_DOMAIN}\`"
            echo "- Minimum replicas: \`1\`"
            echo "- Maximum replicas: \`1\`"
          } >> "${GITHUB_STEP_SUMMARY}"
